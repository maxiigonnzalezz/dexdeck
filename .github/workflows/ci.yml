name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tipos, build y tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.15.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type and Svelte check
        run: pnpm check

      - name: Import tests
        run: pnpm test:import

      # `pnpm check` no valida el CSS; solo el build real lo hace.
      - name: Production build
        run: pnpm build

      # La conf de WDIO usa el Chromium/chromedriver del sistema; en CI se
      # instalan aquí y se pasan por CHROME_BIN/CHROMEDRIVER_PATH.
      - name: Set up Chrome and ChromeDriver
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: UI tests (Chromium con Tauri simulado)
        run: pnpm test:ui
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}

  rust:
    name: Rust (tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.15.0
          runtime: node@22
          cache: true
          install: false

      # tauri-build comprueba que exista el frontend compilado antes de
      # ejecutar los tests del crate.
      - name: Build frontend for tauri-build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
