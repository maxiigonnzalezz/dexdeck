name: Publish DexDeck release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: dexdeck-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux x64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.15.0
          runtime: node@22
          cache: true
          install: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Verify tag matches application version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" || "$TAG_VERSION" != "$TAURI_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($PACKAGE_VERSION) and tauri.conf.json ($TAURI_VERSION)."
            exit 1
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Build Linux bundles
        run: pnpm tauri build --bundles appimage,deb --verbose

      - name: Prepare stable release filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/linux
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -iname '*.appimage' -print -quit)"
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [[ -z "$APPIMAGE" ]]; then
            echo 'No se ha encontrado el AppImage generado.'
            exit 1
          fi
          if [[ -z "$DEB" ]]; then
            echo 'No se ha encontrado el paquete DEB generado.'
            exit 1
          fi
          cp "$APPIMAGE" release-assets/linux/DexDeck-Linux-x64.AppImage
          cp "$DEB" release-assets/linux/DexDeck-Linux-x64.deb
          ls -lah release-assets

      - name: Upload Linux release files
        uses: actions/upload-artifact@v7
        with:
          name: DexDeck-Linux-x64
          path: release-assets/linux/*
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.15.0
          runtime: node@22
          cache: true
          install: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $packageVersion -or $tagVersion -ne $tauriVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json ($packageVersion) and tauri.conf.json ($tauriVersion)."
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Build Windows NSIS installer
        run: pnpm tauri build --bundles nsis --verbose

      - name: Prepare stable release filename
        shell: pwsh
        run: |
          $installerDirectory = 'src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem -Path $installerDirectory -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS setup installer in $installerDirectory; found $($installers.Count)."
          }
          New-Item -ItemType Directory -Force -Path 'release-assets/windows' | Out-Null
          Copy-Item $installers[0].FullName 'release-assets/windows/DexDeck-Windows-x64-Setup.exe'
          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Upload Windows release file
        uses: actions/upload-artifact@v7
        with:
          name: DexDeck-Windows-x64
          path: release-assets/windows/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux release files
        uses: actions/download-artifact@v7
        with:
          name: DexDeck-Linux-x64
          path: release-assets/linux

      - name: Download Windows release file
        uses: actions/download-artifact@v7
        with:
          name: DexDeck-Windows-x64
          path: release-assets/windows

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum linux/DexDeck-Linux-x64.AppImage linux/DexDeck-Linux-x64.deb windows/DexDeck-Windows-x64-Setup.exe > SHA256SUMS.txt

      - name: Publish release and attach installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DexDeck ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/linux/DexDeck-Linux-x64.AppImage
            release-assets/linux/DexDeck-Linux-x64.deb
            release-assets/windows/DexDeck-Windows-x64-Setup.exe
            release-assets/SHA256SUMS.txt
