name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'static/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'svelte.config.*'
      - 'vite.config.*'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'static/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'svelte.config.*'
      - 'vite.config.*'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: 12.15.0
          runtime: node@22
          cache: true
          install: false

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Show toolchain versions
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: pnpm check

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis --verbose

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: DexDeck-Windows-x64-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
